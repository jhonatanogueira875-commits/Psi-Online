<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psi Online — Pagamento aprovado</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root{ --ink:#1F2A24; --bg:#FAF7F2; --sage:#3F6659; --sage-light:#E4ECE6; --line:#D9D2C7; }
  *{ box-sizing:border-box; }
  body{ font-family:'IBM Plex Sans',system-ui,sans-serif; max-width:480px; margin:80px auto; padding:0 20px; color:var(--ink); background:var(--bg); text-align:center; }
  .icone{ font-size:48px; margin-bottom:16px; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:24px; margin:0 0 12px; }
  p{ font-size:14px; color:#5A655D; line-height:1.6; }
  a.btn{ display:inline-block; margin-top:20px; background:var(--sage); color:#fff; text-decoration:none; padding:11px 22px; border-radius:4px; font-size:14px; font-weight:500; }
  a.btn:hover{ background:#345349; }
</style>
</head>
<body>

<div class="icone">✅</div>
<h1>Pagamento aprovado!</h1>
<p>Seu pagamento foi confirmado. Agora é só aguardar o psicólogo confirmar o horário — você será avisado por aqui, em "Minhas consultas".</p>
<a class="btn" href="minhas-consultas.html">Ver minhas consultas</a>

</body>
</html>
