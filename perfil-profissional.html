<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psi Online — Perfil Profissional</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root{ --ink:#1F2A24; --bg:#FAF7F2; --sage:#3F6659; --sage-light:#E4ECE6; --ochre:#C89B3C; --line:#D9D2C7; }
  *{ box-sizing: border-box; }
  body{ font-family:'IBM Plex Sans',system-ui,sans-serif; max-width:560px; margin:48px auto; padding:0 20px; color:var(--ink); background:var(--bg); }
  a.voltar{ color:var(--sage); text-decoration:none; font-size:14px; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:8px 0 4px; }
  .sub{ font-size:14px; color:#5A655D; margin-bottom:28px; }
  label{ display:block; margin-top:18px; font-size:14px; font-weight:600; }
  .hint{ font-size:12px; color:#8a8f8a; font-weight:400; margin-top:2px; }
  input, textarea{ width:100%; padding:10px; margin-top:6px; box-sizing:border-box; font-size:14px; border:1px solid var(--line); border-radius:4px; font-family:inherit; background:#fff; }
  textarea{ min-height:100px; resize:vertical; }
  button{ margin-top:24px; padding:11px 20px; font-size:14px; cursor:pointer; background:var(--sage); color:#fff; border:none; border-radius:4px; font-family:inherit; font-weight:500; }
  button:hover{ background:#345349; }
  button:disabled{ opacity:0.6; cursor:default; }
  #resultado{ margin-top:20px; padding:12px; border-radius:6px; font-size:13px; white-space:pre-wrap; }
  .ok{ background:var(--sage-light); color:#1e4620; }
  .erro{ background:#fbe9e7; color:#7a2e22; }
  .contador{ font-size:12px; color:#8a8f8a; text-align:right; margin-top:4px; }
  .contador.limite{ color:#b04a3f; }
  .status-badge{ display:inline-block; margin-top:4px; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:500; }
  .status-pending{ background:#FBF3E3; color:var(--ochre); }
  .status-approved{ background:var(--sage-light); color:var(--sage); }
  .status-rejected, .status-suspended{ background:#fbe9e7; color:#7a2e22; }
  .cabecalho-foto{ display:flex; align-items:center; gap:16px; margin-bottom:24px; }
  .avatar-preview{ width:76px; height:76px; border-radius:50%; background:var(--sage-light); color:var(--sage); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:24px; flex-shrink:0; overflow:hidden; }
  .avatar-preview img{ width:100%; height:100%; object-fit:cover; }
  .foto-info .nome{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0 0 6px; }
  .btn-foto{ margin-top:0; padding:7px 14px; font-size:13px; background:#fff; color:var(--sage); border:1px solid var(--sage); }
  .btn-foto:hover{ background:var(--sage-light); }
  input[type="file"]{ display:none; }
  .foto-hint{ font-size:12px; color:#8a8f8a; margin-top:6px; }
</style>
</head>
<body>

<a class="voltar" href="login.html?tipo=psicologo">← Voltar</a>
<h1>Perfil profissional</h1>
<p class="sub">Essas informações aparecerão para pacientes quando o perfil for aprovado.</p>

<div id="carregando">Carregando seus dados…</div>

<form id="form-perfil" style="display:none;">
  <div class="cabecalho-foto">
    <div class="avatar-preview" id="avatar-preview">?</div>
    <div class="foto-info">
      <p class="nome" id="nome-display"></p>
      <button type="button" class="btn-foto" id="btn-trocar-foto">Alterar foto</button>
      <input type="file" id="input-foto" accept="image/png, image/jpeg, image/webp">
      <p class="foto-hint">JPG, PNG ou WebP — até 2MB</p>
    </div>
  </div>

  <div>
    <span class="hint">Status de aprovação</span>
    <span id="status-badge" class="status-badge">—</span>
  </div>

  <label>CRP
    <span class="hint">Não pode ser alterado por aqui</span>
  </label>
  <input type="text" id="crp" disabled>

  <label>Bio
    <span class="hint">Um resumo objetivo — o paciente vê a versão completa ao abrir seu perfil</span>
  </label>
  <textarea id="bio" maxlength="350" placeholder="Conte um pouco sobre sua abordagem e experiência..."></textarea>
  <div class="contador" id="contador-bio">0 / 350</div>

  <label>Especialidades
    <span class="hint">Separadas por vírgula — ex: ansiedade, terapia de casal, TCC</span>
  </label>
  <input type="text" id="specialties" placeholder="ansiedade, terapia de casal, TCC">

  <label>Valor da consulta (R$)</label>
  <input type="number" id="session_price" step="0.01" min="0" placeholder="150.00">

  <label>LinkedIn
    <span class="hint">Opcional — link completo do seu perfil</span>
  </label>
  <input type="text" id="linkedin_url" placeholder="https://www.linkedin.com/in/seu-perfil">

  <button type="submit" id="btn-salvar">Salvar alterações</button>
</form>

<div id="resultado"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://dftvnrxotgpmitjwlcxb.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_RoOTSSau2P38yck73_HBdw_LQha87E0";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const resultadoDiv = document.getElementById("resultado");
  const carregandoDiv = document.getElementById("carregando");
  const form = document.getElementById("form-perfil");
  const statusBadge = document.getElementById("status-badge");

  const STATUS_LABEL = {
    pending: "Aguardando aprovação",
    approved: "Aprovado",
    rejected: "Rejeitado",
    suspended: "Suspenso"
  };

  let userId = null;

  const avatarPreview = document.getElementById("avatar-preview");

  function iniciais(nome){
    if (!nome) return "?";
    return nome.trim().split(/\s+/).slice(0,2).map(p => p[0].toUpperCase()).join("");
  }

  function atualizarPreviewAvatar(url, nomeParaIniciais){
    if (url) {
      avatarPreview.innerHTML = '<img src="' + url + '" alt="Foto de perfil">';
    } else {
      avatarPreview.textContent = iniciais(nomeParaIniciais || document.getElementById("nome-display").textContent);
    }
  }

  document.getElementById("btn-trocar-foto").addEventListener("click", () => {
    document.getElementById("input-foto").click();
  });

  document.getElementById("input-foto").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (file.size > 2 * 1024 * 1024) {
      resultadoDiv.className = "erro";
      resultadoDiv.textContent = "❌ A imagem precisa ter até 2MB.";
      return;
    }

    const btnFoto = document.getElementById("btn-trocar-foto");
    btnFoto.disabled = true;
    btnFoto.textContent = "Enviando...";

    const extensao = file.name.split(".").pop();
    const caminho = userId + "/avatar." + extensao;

    const { error: erroUpload } = await supabaseClient
      .storage
      .from("avatars")
      .upload(caminho, file, { upsert: true, contentType: file.type });

    if (erroUpload) {
      btnFoto.disabled = false;
      btnFoto.textContent = "Alterar foto";
      resultadoDiv.className = "erro";
      resultadoDiv.textContent = "❌ Erro ao enviar a foto:\n" + erroUpload.message;
      return;
    }

    const { data: urlData } = supabaseClient.storage.from("avatars").getPublicUrl(caminho);
    const urlComCacheBust = urlData.publicUrl + "?t=" + Date.now();

    const { error: erroUpdate } = await supabaseClient
      .from("profiles")
      .update({ avatar_url: urlComCacheBust })
      .eq("id", userId);

    btnFoto.disabled = false;
    btnFoto.textContent = "Alterar foto";

    if (erroUpdate) {
      resultadoDiv.className = "erro";
      resultadoDiv.textContent = "❌ Foto enviada, mas não consegui salvar o link:\n" + erroUpdate.message;
      return;
    }

    atualizarPreviewAvatar(urlComCacheBust);
    resultadoDiv.className = "ok";
    resultadoDiv.textContent = "✅ Foto atualizada!";
  });

  async function carregar() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = "login.html?tipo=psicologo";
      return;
    }

    userId = session.user.id;

    const { data: perfil, error } = await supabaseClient
      .from("psychologists")
      .select("crp, bio, specialties, session_price, approval_status, linkedin_url")
      .eq("profile_id", userId)
      .single();

    if (error) {
      carregandoDiv.textContent = "";
      resultadoDiv.className = "erro";
      resultadoDiv.textContent = "❌ Não foi possível carregar seu perfil:\n" + error.message +
        "\n\n(Esse formulário é só para psicólogos já cadastrados.)";
      return;
    }

    const { data: profileData } = await supabaseClient
      .from("profiles")
      .select("full_name, avatar_url")
      .eq("id", userId)
      .single();

    document.getElementById("nome-display").textContent = (profileData && profileData.full_name) || "(nome não informado)";
    atualizarPreviewAvatar(profileData && profileData.avatar_url);

    document.getElementById("crp").value = perfil.crp || "";
    document.getElementById("bio").value = perfil.bio || "";
    document.getElementById("specialties").value = (perfil.specialties || []).join(", ");
    document.getElementById("session_price").value = perfil.session_price ?? "";
    document.getElementById("linkedin_url").value = perfil.linkedin_url || "";
    atualizarContador();

    statusBadge.textContent = STATUS_LABEL[perfil.approval_status] || perfil.approval_status;
    statusBadge.classList.add("status-" + perfil.approval_status);

    carregandoDiv.style.display = "none";
    form.style.display = "block";
  }

  const bioTextarea = document.getElementById("bio");
  const contadorBio = document.getElementById("contador-bio");
  function atualizarContador(){
    const len = bioTextarea.value.length;
    contadorBio.textContent = len + " / 350";
    contadorBio.classList.toggle("limite", len >= 350);
  }
  bioTextarea.addEventListener("input", atualizarContador);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const btn = document.getElementById("btn-salvar");
    btn.disabled = true;
    btn.textContent = "Salvando...";

    const bio = document.getElementById("bio").value.trim();
    const specialtiesRaw = document.getElementById("specialties").value.trim();
    const specialties = specialtiesRaw
      ? specialtiesRaw.split(",").map(s => s.trim()).filter(Boolean)
      : [];
    const session_price = document.getElementById("session_price").value || null;
    let linkedin_url = document.getElementById("linkedin_url").value.trim();
    if (linkedin_url && !/^https?:\/\//i.test(linkedin_url)) {
      linkedin_url = "https://" + linkedin_url;
    }
    linkedin_url = linkedin_url || null;

    const { error } = await supabaseClient
      .from("psychologists")
      .update({ bio, specialties, session_price, linkedin_url })
      .eq("profile_id", userId);

    btn.disabled = false;
    btn.textContent = "Salvar alterações";

    if (error) {
      resultadoDiv.className = "erro";
      resultadoDiv.textContent = "❌ Erro ao salvar:\n" + error.message;
      return;
    }

    resultadoDiv.className = "ok";
    resultadoDiv.textContent = "✅ Perfil atualizado com sucesso!";
  });

  carregar();
</script>

</body>
</html>
